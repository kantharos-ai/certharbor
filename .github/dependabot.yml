version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # go-jose v4.1.9 removed jwt.Builder.CompactSerialize, and
      # go.step.sm/crypto v0.92.0 removed jose.Expected.Audience. Both breaks
      # are required by github.com/smallstep/certificates v0.30.2 (pinned,
      # already the latest available release), which hasn't adopted the new
      # APIs yet. Re-enable once smallstep/certificates bumps past this, or
      # bump manually alongside a smallstep/certificates upgrade. See PR #34
      # (closed, fix applied directly) and PR #67 (same recurrence, closed).
      - dependency-name: "github.com/go-jose/go-jose/v4"
        versions: [">4.1.8"]
      - dependency-name: "go.step.sm/crypto"
        versions: [">0.91.1"]
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      docker-all:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      docker-all:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: npm
    directory: /clients/ts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: npm
    directory: /test/e2e
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      actions-all:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(ci)"
      include: scope
